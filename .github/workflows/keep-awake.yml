# Pings the backend every 10 minutes so Render's free tier doesn't put
# it to sleep (free services sleep after 15 idle minutes). GitHub may
# run scheduled jobs a few minutes late, so an external monitor such as
# cron-job.org or UptimeRobot is still recommended alongside this.
name: Keep backend awake

on:
  schedule:
    # 06:00–23:59 Nigeria time (05–22 UTC) only, so this service uses
    # ~560 of the workspace's 750 free Render hours a month and leaves
    # room for other free services. At night the first visitor waits
    # about a minute while it wakes.
    - cron: '*/10 5-22 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://zappi-pay-backend.onrender.com/api/health || echo "Ping failed (server may be restarting)"
