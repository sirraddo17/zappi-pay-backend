# Runs the backend tests on every pull request (including the AI's) and on
# every push to main. Tests use an in-memory database and fake partners —
# no real database, keys or money are ever touched (see test/setup.js).
name: Backend tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
